{% extends "base.html" %}
{% block content %}
<div class="ms-auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="ms-auth-card">
                    <div class="row g-0">
                        <div class="col-lg-6">
                            <div class="ms-auth-left">
                                <h2 class="ms-auth-title">Join Mini Shop 🎉</h2>
                                <p class="ms-auth-subtitle">Create your free account and start discovering premium products</p>

                                <form method="POST">
                                    <div class="ms-form-group">
                                        <label class="ms-label">Full Name</label>
                                        <input type="text" name="name" class="ms-input" placeholder="Your full name" required>
                                    </div>

                                    <div class="ms-form-group">
                                        <label class="ms-label">Email Address</label>
                                        <input type="email" name="email" class="ms-input" placeholder="you@example.com" required>
                                    </div>

                                    <div class="ms-form-group">
                                        <label class="ms-label">Password</label>
                                        <input type="password" name="password" class="ms-input" placeholder="Create a strong password" required>
                                    </div>

                                    <button type="submit" class="ms-btn ms-btn-gold ms-btn-lg ms-btn-block">Create Account →</button>
                                </form>

                                <p class="text-center mt-4" style="font-size:14px;color:var(--text-muted);">
                                    Already a member? <a href="{{ url_for('login') }}" style="color:var(--gold-dark);font-weight:700;">Sign in here</a>
                                </p>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="ms-auth-right">
                                <img src="https://images.unsplash.com/photo-1607083206869-4c7672e72a8a?w=500&q=80" alt="Premium Gift Boxes" style="border-radius:20px;max-height:220px;object-fit:cover;width:100%;">
                                <p class="ms-auth-quote mt-4">
                                    "Life is too short to wear boring things."
                                </p>
                                <p style="font-size:13px;color:var(--text-muted);margin-top:8px;">Start your style journey today ✨</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
